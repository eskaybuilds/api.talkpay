services:
  postgres:
    image: postgres:16-alpine
    container_name: talkpay-postgres
    environment:
      POSTGRES_USER: talkpay
      POSTGRES_PASSWORD: talkpay
      POSTGRES_DB: talkpay
    ports:
      - '5432:5432'
    volumes:
      - talkpay-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U talkpay -d talkpay']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  talkpay-pgdata:
