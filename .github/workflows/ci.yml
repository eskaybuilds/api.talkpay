name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

  e2e:
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: talkpay
          POSTGRES_PASSWORD: talkpay
          POSTGRES_DB: talkpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talkpay -d talkpay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USERNAME: talkpay
      DATABASE_PASSWORD: talkpay
      DATABASE_NAME: talkpay_test
      DATABASE_SYNC: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn migration:run
      - run: yarn test:e2e
